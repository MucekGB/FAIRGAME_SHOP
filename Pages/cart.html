<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review and update your Fairgame Shop shopping cart.">
    <meta name="theme-color" content="#050505">
    <meta property="og:title" content="Fairgame Shop | Cart">
    <meta property="og:description" content="Review and update your Fairgame Shop shopping cart.">
    <meta property="og:type" content="website">
    <title>Fairgame Shop | Cart</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/fx.css">
    <script src="../js/script.js" defer></script>
    <script src="../js/fx.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Header: logo and main navigation -->
    <header>
        <a href="index.html" class="logo" aria-label="Fairgame Shop home">
            <img src="../media/images/logo.svg" alt="Fairgame Shop">
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false"
            aria-controls="main-navigation" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
        <nav id="main-navigation" aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html" aria-current="page">Cart (<span class="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <!-- JavaScript inserts saved cart items and calculates the total -->
    <main id="main-content">
        <h1>Shopping cart</h1>
        <section id="cart-items" aria-live="polite">
            <p>Your cart is currently empty.</p>
        </section>
        <div class="cart-summary">
            <p>Total</p>
            <strong id="cart-total">&pound;0.00</strong>
        </div>
    </main>

    <!-- Footer: brand, links, social media and project details -->
    <footer>
        <div class="footer-inner">
            <div class="footer-brand">
                <a href="index.html" class="footer-logo" aria-label="Fairgame Shop home">
                    <span aria-hidden="true"></span>
                </a>
                <p>The best gaming shop. The best prices.</p>
            </div>
            <div class="footer-centre">
                <nav class="footer-nav" aria-label="Footer navigation">
                    <a href="index.html">Home</a>
                    <a href="products.html">Products</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                    <a href="cart.html">Cart</a>
                </nav>
                <div class="footer-socials" role="group" aria-label="Social media">
                    <a href="https://www.instagram.com/" target="_blank"
                        rel="noopener noreferrer" aria-label="Instagram">
                        <span class="social-icon instagram-icon" aria-hidden="true"></span>
                    </a>
                    <a href="https://www.tiktok.com/" target="_blank"
                        rel="noopener noreferrer" aria-label="TikTok">
                        <span class="social-icon tiktok-icon" aria-hidden="true"></span>
                    </a>
                    <a href="https://www.facebook.com/" target="_blank"
                        rel="noopener noreferrer" aria-label="Facebook">
                        <span class="social-icon facebook-icon" aria-hidden="true"></span>
                    </a>
                    <a href="https://discord.com/" target="_blank"
                        rel="noopener noreferrer" aria-label="Discord">
                        <span class="social-icon discord-icon" aria-hidden="true"></span>
                    </a>
                </div>
            </div>
            <div class="footer-details">
                <p>&copy; 2026 Fairgame Shop</p>
                <p>Project created by Mateusz Mucek</p>
                <p>ID: G271130</p>
            </div>
        </div>
    </footer>
</body>
</html>
